<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Title is set at bootstrap from APP_NAME; a page <title> would override the window title. -->
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No remote resources: the renderer must work offline and load nothing it did not ship with. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
